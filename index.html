<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts: single non-blocking stylesheet, preconnect only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Wikipedia summaries are fetched on hover; warm up the connection -->
    <link rel="preconnect" href="https://en.wikipedia.org" crossorigin />
    <meta name="theme-color" content="#12161f" />
    <meta
      name="description"
      content="Dev Atlas — clear backend engineering notes built for learning by doing."
    />
    <link rel="canonical" href="https://dev-atlas.vercel.app/" data-seo="" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dev Atlas" />
    <meta property="og:title" content="Dev Atlas - Learn Backend Engineering" data-seo-og-title />
    <meta
      property="og:description"
      content="Dev Atlas — clear backend engineering notes built for learning by doing."
      data-seo-og-description
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dev Atlas - Learn Backend Engineering" data-seo-twitter-title />
    <meta
      name="twitter:description"
      content="Dev Atlas — clear backend engineering notes built for learning by doing."
      data-seo-twitter-description
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Dev Atlas",
        "description": "Clear backend engineering notes built for learning by doing."
      }
    </script>
    <title>Dev Atlas - Learn Backend Engineering</title>
    <!-- Google tag (gtag.js) - deferred, fires page_view on SPA navigations via seo.ts -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PB60C0LPF5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PB60C0LPF5', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
